<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotional Email Template</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hero { text-align: center; background: linear-gradient(135deg, #ff416c, #ff4b2b); padding: 40px 20px; border-radius: 8px; }
        .hero h1 { margin: 0; font-size: 28px; }
        .discount-ribbon { background-color: #ffcc00; color: #000000; padding: 5px 10px; font-weight: bold; display: inline-block; margin-top: 10px; border-radius: 4px; }
        .product-cards { display: flex; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
        .card { width: 48%; background-color: #1e1e1e; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; position: relative; }
        .tag { position: absolute; top: 10px; right: 10px; background-color: #ff416c; padding: 2px 5px; font-size: 12px; border-radius: 4px; }
        @media (max-width: 600px) { .card { width: 100%; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Exclusive Dark Mode Offer</h1>
            <div class="discount-ribbon">Save 50% Today Only!</div>
        </div>
        <div class="product-cards">
            <div class="card">
                <span class="tag">Hot</span>
                <h3>Premium Product 1</h3>
                <p>High-quality graphic rich promotional email template card item.</p>
            </div>
            <div class="card">
                <span class="tag">New</span>
                <h3>Premium Product 2</h3>
                <p>Responsive 2-column layout designed with Outlook bulletproof tables.</p>
            </div>
        </div>
    </div>
</body>
</html>
